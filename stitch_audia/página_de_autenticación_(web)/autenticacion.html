<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<title>AudIA - Autenticación</title>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Lexend:wght@400;500;700;900" onload="this.rel='stylesheet'" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#47169c",
            "background-light": "#f7f6f8",
            "background-dark": "#171121",
          },
          fontFamily: {
            "display": ["Lexend"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .form-input {
      border-color: #463663;
      background-color: #231b32;
    }
    .form-input:focus {
      border-color: #47169c;
      box-shadow: 0 0 0 1px #47169c;
    }
    .dark .form-input {
      border-color: #463663;
      background-color: #231b32;
    }
    .dark .form-input:focus {
      border-color: #47169c;
      box-shadow: 0 0 0 1px #47169c;
    }
    html.light .form-input {
      border-color: #e5e7eb;
      background-color: #ffffff;
    }
    html.light .form-input:focus {
      border-color: #47169c;
      box-shadow: 0 0 0 1px #47169c;
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white">
<div class="flex min-h-screen flex-col">
<header class="border-b border-gray-200 dark:border-white/10">
<div class="container mx-auto flex h-16 items-center justify-between px-4 sm:px-6 lg:px-8">
<div class="flex items-center gap-3">
<svg class="h-6 w-6 text-primary" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M20 2H14V8H8V14H2V20H20V2Z"></path>
</svg>
<h1 class="text-xl font-bold">AudIA</h1>
</div>
</div>
</header>
<main class="flex flex-1 items-center justify-center py-12 sm:px-6 lg:px-8">
<div class="w-full max-w-md space-y-8 rounded-xl bg-white/5 p-8">
<div>
<h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-gray-900 dark:text-white">
            Bienvenido de nuevo
          </h2>
<p class="mt-2 text-center text-sm text-gray-600 dark:text-gray-400">
            Inicia sesión para continuar con tu aprendizaje.
          </p>
</div>
<form action="#" class="mt-8 space-y-6" method="POST">
<div class="space-y-4 rounded-md shadow-sm">
<div>
<label class="sr-only" for="email-address">Correo electrónico</label>
<input autocomplete="email" class="form-input relative block w-full appearance-none rounded-lg border px-3 py-3 placeholder-gray-500 focus:z-10 focus:outline-none sm:text-sm" id="email-address" name="email" placeholder="Correo electrónico" required="" type="email"/>
</div>
<div>
<label class="sr-only" for="password">Contraseña</label>
<input autocomplete="current-password" class="form-input relative block w-full appearance-none rounded-lg border px-3 py-3 placeholder-gray-500 focus:z-10 focus:outline-none sm:text-sm" id="password" name="password" placeholder="Contraseña" required="" type="password"/>
</div>
</div>
<div class="flex items-center justify-between">
<div class="text-sm">
<a class="font-medium text-primary hover:text-primary/80" href="#">
                ¿Olvidaste tu contraseña?
              </a>
</div>
</div>
<div>
<button class="group relative flex w-full justify-center rounded-lg border border-transparent bg-primary px-4 py-3 text-sm font-semibold text-white hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark" type="submit">
              Iniciar Sesión
            </button>
</div>
</form>
<div class="text-center text-sm">
<p class="text-gray-600 dark:text-gray-400">
            ¿No tienes una cuenta?
            <a class="font-medium text-primary hover:text-primary/80" href="#">
              Regístrate
            </a>
</p>
</div>
</div>
</main>
</div>

</body></html>
